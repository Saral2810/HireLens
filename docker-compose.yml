# Local container run. Put your settings in .env (copy .env.example).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-screening-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
